name: Recover retained release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful delivery run that retained the known-good artifact
        required: true
        type: string
      source_sha:
        description: Exact 40-character source SHA of that run
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Select successful same-repository source
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_RUN: ${{ inputs.run_id }}
          RECOVERY_SHA: ${{ inputs.source_sha }}
        run: bun scripts/select-recovery.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: retained/
          merge-multiple: true
      - name: Verify and stage retained bytes without rebuilding
        env:
          RECOVERY_SHA: ${{ inputs.source_sha }}
        run: bun scripts/stage-pages.mjs "$RECOVERY_SHA" retained
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    outputs:
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  observe:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun --bun playwright install --with-deps chromium
      - name: Recheck the restored HTTPS task
        env:
          SITE_URL: ${{ needs.deploy.outputs.url }}
          RECOVERY_SHA: ${{ inputs.source_sha }}
        run: bun scripts/smoke.mjs "$SITE_URL" "$RECOVERY_SHA"
